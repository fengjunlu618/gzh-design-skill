    </p>

    </p>

<script>
  var THEMES=[[["摸鱼绿（默认）", "#059669", "moyu-green"], ["红白色系", "#DC2626", "red-white"], ["石墨极简风", "#52525B", "graphite-minimal"], ["留白禅意风", "#4A5D52", "zen-whitespace"], ["摸鱼票据风", "#059669", "moyu-ticket"], ["橄榄手记", "#1e1f23", "olive-journal"]]];
  var tabs=document.getElementById('tabs'), panes=document.getElementById('panes');
  THEMES.forEach(function(t,i){
    var name=t[0],color=t[1],slug=t[2];
    var src=document.getElementById('th-'+slug).textContent;
    var tab=document.createElement('div');
    tab.className='tab'+(i===0?' active':'');
    tab.innerHTML='<span class="dot" style="background:'+color+'"></span>'+name;
    tab.onclick=function(){show(i);};
    tabs.appendChild(tab);
    var pane=document.createElement('div');
    pane.className='pane'+(i===0?' active':'');
    var f=document.createElement('iframe');
    f.srcdoc=src;
    pane.appendChild(f);
    panes.appendChild(pane);
  });
  function show(i){
    var ts=tabs.children, ps=panes.children;
    for(var k=0;k<ts.length;k++){ts[k].classList.toggle('active',k===i);ps[k].classList.toggle('active',k===i);}
  }
</script>
